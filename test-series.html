<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Error Book Refresh Test Series</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#667085;--pr:#4f46e5;--ok:#16a34a;--no:#dc2626;--sk:#d97706;--bd:#e3e6ee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1c1f2b;--tx:#eef0f6;--mu:#98a2b3;--pr:#818cf8;--ok:#4ade80;--no:#f87171;--sk:#fbbf24;--bd:#2c3040}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--tx)}
.w{max-width:900px;margin:auto;padding:16px}
.brand{display:flex;align-items:center;gap:10px;font-size:1.4rem;font-weight:800;color:var(--pr)}
.brand svg{width:38px;height:38px;flex:none}
.sub{color:var(--mu);margin-bottom:10px}
.tabs{display:flex;gap:8px;margin:12px 0}
.tabs button{flex:1;padding:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:1rem;cursor:pointer}
.tabs button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.ch{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;cursor:pointer}
.ch small{display:block;color:var(--mu);margin-top:4px}
.sh{background:var(--pr);color:#fff;padding:10px 14px;border-radius:10px;margin:18px 0 6px;font-weight:700}
.chh{margin:12px 0 4px;color:var(--mu);font-weight:600}
.q{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin:8px 0}
.o{display:block;padding:8px 10px;margin:6px 0;border:1px solid var(--bd);border-radius:8px;cursor:pointer}
.o.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.o.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 15%,transparent)}
.btn{padding:12px 20px;border:0;border-radius:10px;background:var(--pr);color:#fff;font-size:1rem;cursor:pointer;margin:6px 6px 6px 0}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.box{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin:10px 0}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:420px}
th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:center}
th:first-child,td:first-child{text-align:left}
.g1{color:var(--ok);font-weight:700}.r1{color:var(--no);font-weight:700}.y1{color:var(--sk);font-weight:700}
</style>
</head>
<body>
<div class="w">
<div class="brand"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="9" y="5" width="30" height="38" rx="5" fill="currentColor"/><rect x="15" y="3" width="18" height="7" rx="3" fill="var(--card)" stroke="currentColor" stroke-width="2.5"/><path d="M15 20l3 3 5-6" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M27 21h7" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><path d="M15 31l3 3 5-6" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M27 32h7" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg><span>Error Book Refresh Test Series</span></div>
<div class="sub">JEE Test Series — Physics • Chemistry • Maths</div>
<div id="app"></div>
</div>
<script>
/* ===== 1. JEE Chapters ===== */
const CHAPTERS={
"Physics":["Units & Measurements","Kinematics","Laws of Motion","Work, Energy & Power","Rotational Motion","Gravitation","Properties of Solids & Liquids","Thermodynamics","Kinetic Theory of Gases","Oscillations & Waves","Electrostatics","Current Electricity","Magnetic Effects & Magnetism","EMI & AC","Electromagnetic Waves","Ray & Wave Optics","Dual Nature of Matter","Atoms & Nuclei","Semiconductor Devices","Communication Systems"],
"Chemistry":["Some Basic Concepts","Atomic Structure","Chemical Bonding","States of Matter","Chemical Thermodynamics","Chemical & Ionic Equilibrium","Redox Reactions","Solutions","Electrochemistry","Chemical Kinetics","Periodic Table","s-Block & p-Block Elements","d & f Block Elements","Coordination Compounds","GOC","Hydrocarbons","Haloalkanes & Haloarenes","Alcohols, Phenols & Ethers","Aldehydes, Ketones & Acids","Amines & Biomolecules"],
"Maths":["Sets, Relations & Functions","Complex Numbers","Quadratic Equations","Matrices & Determinants","Permutations & Combinations","Binomial Theorem","Sequences & Series","Limits, Continuity & Differentiability","Application of Derivatives","Integrals","Differential Equations","Straight Lines","Circles","Conic Sections","3D Geometry","Vectors","Probability","Statistics","Trigonometry","Mathematical Reasoning"]
};

/* ===== 2. Questions =====
   How to add: Q["Subject"]["Chapter"]=[{q:"Question",o:["A","B","C","D"],a:0-3}] (a = correct option number, 0=A) */
const Q={"Physics":{},"Chemistry":{},"Maths":{}};
Q["Physics"]["Kinematics"]=[
{q:"A body is thrown upward at 20 m/s (g = 10 m/s²). What is the maximum height?",o:["10 m","20 m","30 m","40 m"],a:1},
{q:"The slope of an x-t graph represents:",o:["Acceleration","Displacement","Velocity","Force"],a:2}];
Q["Physics"]["Laws of Motion"]=[
{q:"A force of 20 N acts on a 5 kg mass. The acceleration is:",o:["2 m/s²","5 m/s²","10 m/s²","4 m/s²"],a:3}];
Q["Chemistry"]["Atomic Structure"]=[
{q:"Maximum number of electrons in the n = 3 shell?",o:["8","18","32","2"],a:1},
{q:"Number of neutrons in ₆C¹⁴ is:",o:["6","12","8","14"],a:2}];
Q["Chemistry"]["Chemical Bonding"]=[
{q:"The bond angle in H₂O is approximately:",o:["90°","109.5°","120°","104.5°"],a:3}];
Q["Maths"]["Quadratic Equations"]=[
{q:"The roots of x² − 5x + 6 = 0 are:",o:["1, 6","2, 3","−2, −3","1, 5"],a:1},
{q:"The sum of roots of 2x² − 8x + 3 = 0 is:",o:["2","−4","4","8/3"],a:2}];
Q["Maths"]["Integrals"]=[
{q:"∫ x dx = ?",o:["x²/2 + C","x + C","2x + C","x³/3 + C"],a:0}];

/* ===== 3. Logic ===== */
const app=document.getElementById("app");
let mode="",F=[];
const cnt=(s,c)=>(Q[s][c]||[]).length;

function home(){
  app.innerHTML=`<div class="grid">
   <div class="ch" onclick="subjects('Full')"><b>📚 Full Syllabus Test</b><small>Complete subject syllabus in one test</small></div>
   <div class="ch" onclick="subjects('Part')"><b>📖 Part Syllabus Test</b><small>Chapter-wise tests</small></div></div>`;
}
function subjects(m){
  mode=m;
  app.innerHTML=`<h2>${m} Syllabus Test</h2><div class="grid">`+
   Object.keys(CHAPTERS).map(s=>`<div class="ch" onclick="chapters('${s}')"><b>${s}</b><small>${CHAPTERS[s].length} chapters</small></div>`).join("")+
   `</div><button class="btn g" onclick="home()">← Back</button>`;
}
function chapters(s){
  const full=mode==="Full";
  const cards=CHAPTERS[s].map((c,i)=>{
    const n=cnt(s,c);
    const sub=n?n+' questions':'Coming Soon';
    return `<div class="ch" ${full?'style="cursor:default"':`onclick="runChapter('${s}',${i})"`}><b>${i+1}. ${c}</b><small>${sub}</small></div>`;
  }).join("");
  const top=full?`<button class="btn" onclick="runSubject('${s}')">Start ${s} Full Syllabus Test</button><button class="btn g" onclick="runAll()">Full PCM Test (all subjects)</button><p class="chh">Chapters included:</p>`:`<p class="chh">Select a chapter:</p>`;
  app.innerHTML=`<h2>${s} — ${mode} Syllabus Test</h2>${top}<div class="grid">${cards}</div><button class="btn g" onclick="subjects('${mode}')">← Back</button>`;
}

function collect(list){F=[];list.forEach(([s,c])=>(Q[s][c]||[]).forEach(x=>F.push({s,c,x})));return F.length;}
function runChapter(s,i){const c=CHAPTERS[s][i];if(!collect([[s,c]])){alert("Coming Soon");return;}render(`${s} — ${c}`,s);}
function runSubject(s){collect(CHAPTERS[s].map(c=>[s,c]));F.length?render(`${s} — Full Syllabus Test`,s):alert("Coming Soon");}
function runAll(){const l=[];Object.keys(CHAPTERS).forEach(s=>CHAPTERS[s].forEach(c=>l.push([s,c])));collect(l);F.length?render("Full PCM Test",""):alert("Coming Soon");}

function render(title,s){
  let h=`<h2>${title}</h2>`,ps="",pc="";
  F.forEach((f,n)=>{
    if(f.s!==ps){h+=`<div class="sh">${f.s}</div>`;ps=f.s;pc="";}
    if(f.c!==pc){h+=`<div class="chh">${f.c}</div>`;pc=f.c;}
    h+=`<div class="q"><b>Q${n+1}. ${f.x.q}</b>`+f.x.o.map((t,k)=>`<label class="o" id="o${n}_${k}"><input type="radio" name="q${n}" value="${k}"> ${"ABCD"[k]}. ${t}</label>`).join("")+`</div>`;
  });
  app.innerHTML=h+`<div id="res"></div><button class="btn" id="sb" onclick="submitTest()">Submit</button><button class="btn g" onclick="${s?`chapters('${s}')`:`subjects('Full')`}">← Back</button>`;
  window.scrollTo(0,0);
}

function submitTest(){
  const st={};
  F.forEach((f,n)=>{
    const p=document.querySelector(`input[name=q${n}]:checked`);
    const r=((st[f.s]=st[f.s]||{})[f.c]=st[f.s][f.c]||{ok:0,bad:0,sk:0});
    document.getElementById(`o${n}_${f.x.a}`).classList.add("ok");
    if(!p)r.sk++;
    else if(+p.value===f.x.a)r.ok++;
    else{r.bad++;document.getElementById(`o${n}_${p.value}`).classList.add("no");}
  });
  let h=`<div class="box"><h3>📊 Section-wise Result</h3>`,T={ok:0,bad:0,sk:0};
  Object.keys(st).forEach(s=>{
    const t={ok:0,bad:0,sk:0};let rows="";
    Object.keys(st[s]).forEach(c=>{const r=st[s][c];
      rows+=`<tr><td>${c}</td><td class="g1">${r.ok}</td><td class="r1">${r.bad}</td><td class="y1">${r.sk}</td></tr>`;
      ["ok","bad","sk"].forEach(k=>t[k]+=r[k]);});
    ["ok","bad","sk"].forEach(k=>T[k]+=t[k]);
    h+=`<div class="sh">${s}: ${t.ok} Correct • ${t.bad} Incorrect • ${t.sk} Unattempted</div>
      <div class="tw"><table><tr><th>Chapter</th><th>✔ Correct</th><th>✘ Incorrect</th><th>— Skipped</th></tr>${rows}</table></div>`;
  });
  h+=`<p><b>Total: <span class="g1">${T.ok} Correct</span> • <span class="r1">${T.bad} Incorrect</span> • <span class="y1">${T.sk} Unattempted</span> (out of ${F.length})</b></p></div>`;
  document.getElementById("res").innerHTML=h;
  document.getElementById("sb").disabled=true;
  document.getElementById("res").scrollIntoView({behavior:"smooth"});
}
home();
</script>
</body>
</html>
